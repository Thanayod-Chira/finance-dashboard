version: '3.8'

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finance_dashboard
    volumes:
      # เก็บข้อมูล database ไว้ใน volume ไม่หายเวลา restart
      - pgdata:/var/lib/postgresql/data
    ports:
      # เปิด port นี้ไว้เพื่อ connect ด้วย DBeaver / pgAdmin จากเครื่อง host
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Node.js Backend ----
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # โหลด .env จาก host ตอน runtime — ไฟล์นี้ไม่ได้อยู่ใน image
      - ./backend/.env
    environment:
      # Override DATABASE_URL ให้ชี้มาที่ "postgres" (ชื่อ service) แทน localhost
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/finance_dashboard
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- React Frontend (Nginx) ----
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
